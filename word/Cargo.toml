[package]
name = "fbrl-word"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
categories.workspace = true
description = "Foveal attention word recognition built on flodl"
keywords = ["deep-learning", "attention", "foveal", "word-recognition"]

[features]
default = []
cuda = ["flodl/cuda", "fbrl/cuda"]

[dependencies]
flodl = { workspace = true }
fbrl = { path = "../letter" }
fontdue = { workspace = true }
glob = { workspace = true }
png = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
