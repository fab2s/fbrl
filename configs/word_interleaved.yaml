model_type: word
n_positions: 4
n_scan_glimpses: 4          # one per position
n_read_glimpses: 20         # total (for compat / info)
scan_patch_size: [12, 18]   # v6-validated
read_patch_size: 12          # v6-validated
latent_dim: 256
n_scales: 1
interleaved: true
n_read_per_group: 5          # reads after each scan

epochs: 200
batch_size: 32
checkpoint_interval: 50
multi_head: true
amp: true

guide_weight: 8.0
blur_sigma_ratio: 0.16
diversity_weight: 1.0
diversity_sigma: 0.1
scan_vy: 0.3
read_vy: 1.5
content_weight: 0.5
edge_weight: 0.0

scaffold_ratio: 0.67
scaffold_floor: 0.0

isolation_weight: 0.5
isolation_random_prob: 0.0

data_dir: data/words
save_dir: data/word_models
