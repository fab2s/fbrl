model_type: letter_motor
n_positions: 1

# v8 backbone geometry (must match checkpoint)
n_scan_glimpses: 1
n_read_glimpses: 8
scan_patch_size: [12, 18]
read_patch_size: 12
latent_dim: 256
n_scales: 1
learnable_scan_x: true

epochs: 100
batch_size: 52
checkpoint_interval: 10
multi_head: false
amp: false

# Attention weights (not used in v5 -- backbone frozen)
scan_guide_weight: 8.0
guide_weight: 0.0
blur_sigma_ratio: 0.16
diversity_weight: 1.0
diversity_sigma: 0.1
scan_vy: 0.3
read_vy: 1.5
diversity_vy: 1.0
content_weight: 0.5
void_weight: 0.5
scan_void_weight: 1.5
recode_weight: 1.0

# Motor v5 -- constrained strokes, self-supervised
motor_enabled: true
motor_n_strokes: 4
motor_points_per_stroke: 20
motor_hidden_dim: 256
render_sigma: 0.75

# Self-supervised losses
ink_weight: 1.0
ink_blur_sigma: 3.0           # final (anneals from start -> final over first half)
ink_blur_sigma_start: 20.0    # broad attractor, narrows to ink_blur_sigma
ink_void_weight: 0.5
rr_cls_weight: 1.0
rr_cls_warmup_ratio: 0.0

# Frozen v8 backbone (runs/letters/v8-9glimpse)
vision_checkpoint: runs/letters/v8-9glimpse/model_final.pth.gz
canonical_font: dejavu-sans

# Legacy motor fields (unused in v5, kept for config compat)
n_trajectory_points: 48
traj_weight: 0.0

# Cosine decay
tmax_motor_ratio: 1.0
lr_floor: 0.00005

# All fonts, both cases
data_dir: data/letters
save_dir: data/motor_models
