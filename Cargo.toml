[workspace]
members = ["letter", "word"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/fab2s/fbrl"
categories = ["science"]

[workspace.dependencies]
# Path-dep wins locally so unreleased flodl improvements still flow in;
# version is the floor when published.
flodl = { version = "0.5.3", path = "../rdl/flodl" }

fontdue = "0.9"
glob = "0.3"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
