services:
  # Python implementation (original)
  python:
    build:
      context: python
    entrypoint: ["tail", "-f", "/dev/null"]
    volumes:
      - ./python/data:/app/data
      - ./python/runs:/app/runs
      - ./python/vision_training.py:/app/vision_training.py
      - ./python/fbrl:/app/fbrl
      - ./python/configs:/app/configs
      - ./python/tests:/app/tests
      - ./python/pytest.ini:/app/pytest.ini
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
