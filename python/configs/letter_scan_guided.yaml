model_type: letter
n_positions: 1
n_scan_glimpses: 1
n_read_glimpses: 6
scan_patch_size: [12, 18]
read_patch_size: 12
latent_dim: 256
n_scales: 1
learnable_scan_x: true

epochs: 100
batch_size: 52
checkpoint_interval: 10
multi_head: false
amp: false

# Blurred guide for scan, void repulsion for reads
scan_guide_weight: 8.0
guide_weight: 0.0
blur_sigma_ratio: 0.16
diversity_weight: 1.0
diversity_sigma: 0.1
scan_vy: 0.3
read_vy: 1.5
diversity_vy: 1.0
content_weight: 0.5
edge_weight: 0.0
void_weight: 0.5
scan_void_weight: 1.5
recode_weight: 1.0

data_dir: data/letters
save_dir: data/letter_models
